name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'site/**'
      - '.github/workflows/preview-deploy.yml'

permissions:
  contents: read
  pull-requests: write

# One live preview per PR; a newer push cancels the in-flight one.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork PRs receive no secrets, so the Cloudflare deploy could not
    # authenticate. Same-repo PRs only; forks are skipped cleanly.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Deploy Workers Preview
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          # A named Preview of the same Worker; its URL is stable across pushes.
          command: preview --name pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on the PR
        if: steps.deploy.outputs.preview-url != '' || steps.deploy.outputs.deployment-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          UNIQUE_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          marker='<!-- preview-url -->'
          url="${PREVIEW_URL:-$UNIQUE_URL}"
          body=$(printf '%s\n\n**Preview deploy:** %s\n\nBuilt from `%s`. Redeploys on each push to this PR; removed when the PR closes.' "$marker" "$url" "$HEAD_SHA")
          # Upsert a single marker comment so re-pushes update in place.
          comments=$(gh api "repos/$REPO/issues/$PR/comments" --paginate)
          id=$(printf '%s' "$comments" | jq -r --arg m "$marker" 'map(select((.body // "") | contains($m))) | .[0].id // empty' | head -n1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body"
          fi

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Delete the PR's Preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: preview delete --name pr-${{ github.event.pull_request.number }}
