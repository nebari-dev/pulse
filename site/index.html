<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Adoption and health metrics for the Nebari ecosystem" />
    <title>Pulse</title>
    <script>
      (() => {
        try {
          // Pulse defaults to dark; only an explicit 'light' choice turns it off.
          var mode = localStorage.getItem("nebari:themeMode");
          if (mode === null) localStorage.setItem("nebari:themeMode", "dark");
          document.documentElement.classList.toggle('dark', mode !== 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
